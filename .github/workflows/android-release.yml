# Signed release AAB for Google Play.
# Needs repository secrets: KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD,
# KEY_ALIAS (see docs/RELEASE_PLAY.md). Without them the job fails early
# with a clear message instead of producing an unsigned bundle.
name: Android Release (AAB)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require signing secrets
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::KEYSTORE_BASE64 secret missing — add signing secrets first (docs/RELEASE_PLAY.md)"; exit 1;
          fi

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: '21' }

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Restore keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/upload.jks

      - name: key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=${{ github.workspace }}/android/upload.jks
          EOF

      - name: Build signed AAB
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: cd android && ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: falah-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
