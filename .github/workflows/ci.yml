name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  secrets:
    name: Secret scan (fails the build on a committed secret)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: ./scripts/secret-scan.sh

  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  database:
    name: Validate PostgreSQL schema + RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: falah
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: falah
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Sanity checks
        run: |
          psql -v ON_ERROR_STOP=1 -At <<'SQL'
          select 'plans: ' || count(*) from subscription_plans;
          select 'sources: ' || count(*) from content_sources;
          insert into auth.users (id) values ('00000000-0000-0000-0000-000000000001');
          insert into content_projects (user_id, title, type, format_id)
            values ('00000000-0000-0000-0000-000000000001', 'ci', 'post', 'ig-post');
          select 'rls tables: ' || count(*) from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and c.relkind = 'r' and c.relrowsecurity;
          SQL
      - name: RLS behavioral tests
        run: psql -v ON_ERROR_STOP=1 -At -f scripts/rls-tests.sql

  docker:
    name: Quran API container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t falah-quran-api:ci ./quran_api
      - name: The image must carry no secrets
        run: |
          docker run --rm --entrypoint sh falah-quran-api:ci -c '
            set -e
            if [ -f .env ]; then echo "FAIL: .env inside the image"; exit 1; fi
            if grep -rIl --exclude-dir=node_modules -E "SERVICE_ROLE_KEY=.|JWT_SECRET=." . 2>/dev/null | grep -q .; then
              echo "FAIL: secret-looking assignment inside the image"; exit 1
            fi
            echo "OK: no secret material in the image"'
      - name: It starts and fails closed without a database
        run: |
          docker run --rm -e DATABASE_URL=postgresql://invalid:5432/none \
            -e PRIVATE_MODE=true falah-quran-api:ci \
            node -e "const {loadEnv}=await import('./src/config/env.ts');
                     const e=loadEnv();
                     if(!e.privateMode||e.flags.publicDataEnabled){process.exit(1)}
                     console.log('OK: container defaults are private')" --input-type=module

  quran-api:
    name: Quran API · typecheck · OpenAPI · import · tests
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: quran_api }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: falah
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:falah@localhost:5432/postgres
      QURAN_DATASET_VERSION: ci
      # Licence flags stay false in CI: the tests enable what they need per case,
      # and the licence gate below asserts the production default is safe.
      PUBLIC_DATA_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quran_api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run openapi:validate
      - name: Apply migrations
        run: npm run db:apply
      - name: Validate the source dataset (no writes)
        run: npm run import -- --validate-only --version=ci
      - name: Import + verify the dataset
        run: npm run import -- --version=ci --translations=en --publish
      - name: Integrity report (machine-readable)
        run: npm run integrity
      - name: Final integrity report (full re-verification)
        run: npm run integrity:final -- --out=/tmp/QURAN_FINAL_INTEGRITY.txt
      - name: Clean-database bootstrap (empty DB → migrate → import → serve → verify)
        run: npm run bootstrap:check
      - name: Cross-source verification (independent datasets)
        run: npm run verify:cross -- --out=/tmp/CROSS_SOURCE_VERIFICATION.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-cross-source-verification
          path: /tmp/CROSS_SOURCE_VERIFICATION.txt
          retention-days: 14
      - name: Audio manifest gate (an incomplete manifest must be refused)
        run: |
          if npm run --silent import:audio -- schemas/audio-manifest.template.json --validate-only; then
            echo "FAIL: the empty manifest template was accepted"; exit 1
          fi
          echo "OK: incomplete audio manifest refused"
      - name: Private posture (defaults must be private)
        run: |
          node --input-type=module -e "
            const { loadEnv } = await import('./src/config/env.ts');
            const env = loadEnv({});
            const bad = [];
            if (!env.privateMode) bad.push('PRIVATE_MODE default is not true');
            if (env.flags.publicDataEnabled) bad.push('publicDataEnabled default is true');
            if (env.flags.publicApiEnabled) bad.push('publicApiEnabled default is true');
            if (env.host !== '127.0.0.1') bad.push('private default host is ' + env.host);
            if (bad.length) { console.error('FAIL:', bad.join('; ')); process.exit(1); }
            console.log('OK: defaults are private');
          "
      - name: Public release gate (must stay BLOCKED while licences are missing)
        run: |
          if npm run --silent release:gate; then
            echo "FAIL: the public release gate reported ALLOWED without licences"; exit 1
          fi
          echo "OK: public release is blocked"
      - name: License gate (public data stays off until rights are confirmed)
        run: |
          node -e "
            const { loadEnv } = await import('./src/config/env.ts');
            const flags = loadEnv().flags;
            if (flags.publicDataEnabled && !flags.contentLicenseConfirmed) {
              console.error('FAIL: PUBLIC_DATA_ENABLED without CONTENT_LICENSE_CONFIRMED');
              process.exit(1);
            }
            console.log('OK: licence flags consistent', JSON.stringify(flags));
          " --input-type=module
      - run: npm test
      # The quality gate (all categories, including these) runs in
      # .github/workflows/quality-gate.yml so the two do not run the same work
      # twice and compete for runners.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-integrity-report
          path: /tmp/QURAN_FINAL_INTEGRITY.txt
          retention-days: 14
