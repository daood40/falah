name: Deploy demo to GitHub Pages

# Deploys ONLY from main (Pages environment protection also enforces this).
# In the dedicated quiz-app repository, every push to main goes live.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static demo (in-browser engine + bundled question bank)
        run: npm run build --workspace=web
        env:
          VITE_DEMO: '1'
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: SPA fallback for deep links
        run: cp web/dist/index.html web/dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
