# FALAH quality gate — every category runs where its tooling actually exists.
#
# gate-core     : the API, database, security, search and regression modules,
#                 next to a real PostgreSQL service.
# gate-web      : the PWA suite and the web static audit, with the root deps.
# gate-docker   : the container matrix, on a runner with a Docker daemon.
# gate-flutter  : the Dart suite, analyze and the web build, with the SDK.
# gate-android  : the release APK plus the on-device run on real emulators.
# gate-merge    : merges every evidence file into the release result and fails
#                 if anything is FAIL, BLOCKED, SKIPPED or below its minimum.
name: Quality Gate

on:
  push:
    branches: ['main', 'claude/**']
  workflow_dispatch:

# A queued run must not kill a run that is already executing: the android and
# docker jobs take tens of minutes, and losing them means losing the evidence.
concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: false

env:
  QURAN_DATASET_VERSION: ci

jobs:
  gate-core:
    name: Gate · core (db · api · security · regression)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run: { working-directory: quran_api }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: falah
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:falah@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quran_api/package-lock.json
      - name: Install PostgreSQL client tools (pg_dump / pg_restore)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 || sudo apt-get install -y postgresql-client
      - run: npm ci
      - run: npm run typecheck
      - run: npm run gate:core
      - name: Why it failed (every non-PASS case)
        if: failure()
        run: node -e "const fs=require('fs');const f='reports/gate-evidence-core.jsonl';if(!fs.existsSync(f)){console.log('no evidence file')}else{for(const l of fs.readFileSync(f,'utf8').split('\n'))if(l.trim()){const r=JSON.parse(l);if(r.status!=='PASS')console.log(r.status,r.test_id,'|',r.description,'| expected',JSON.stringify(r.expected),'| actual',JSON.stringify(r.actual))}}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-evidence-core
          path: quran_api/reports/gate-evidence-core.jsonl
          retention-days: 14

  gate-web:
    name: Gate · web (PWA suite + static audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the PWA dependencies (the web module runs its suite)
        run: npm ci
      - name: Install the API package
        run: npm ci
        working-directory: quran_api
      - name: Run the web category
        run: node tests/gate/run.ts web --label=web
        working-directory: quran_api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-evidence-web
          path: quran_api/reports/gate-evidence-web.jsonl
          retention-days: 14

  gate-docker:
    name: Gate · docker (image · container · stack)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quran_api/package-lock.json
      - name: Docker daemon must be present
        run: docker info
      - run: npm ci
        working-directory: quran_api
      - name: Run the docker category
        run: node tests/gate/run.ts docker-deploy --label=docker
        working-directory: quran_api
      - name: Why it failed (every non-PASS case)
        if: failure()
        working-directory: quran_api
        run: node -e "const fs=require('fs');const f='reports/gate-evidence-docker.jsonl';if(!fs.existsSync(f)){console.log('no evidence file')}else{for(const l of fs.readFileSync(f,'utf8').split('\n'))if(l.trim()){const r=JSON.parse(l);if(r.status!=='PASS')console.log(r.status,r.test_id,'|',r.description,'| expected',JSON.stringify(r.expected),'| actual',JSON.stringify(r.actual))}}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-evidence-docker
          path: quran_api/reports/gate-evidence-docker.jsonl
          retention-days: 14

  gate-flutter:
    name: Gate · flutter (analyze · dart tests · web build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quran_api/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: npm ci
        working-directory: quran_api
      - name: Device expectations (needed by the asset bundle)
        run: node scripts/device-expectations.ts --dataset-version=${{ env.QURAN_DATASET_VERSION }} --edition=quran-json-uthmani-hafs
        working-directory: quran_api
      - name: Run the flutter category
        run: node tests/gate/run.ts flutter --label=flutter
        working-directory: quran_api
      - name: Why it failed (every non-PASS case)
        if: failure()
        working-directory: quran_api
        run: node -e "const fs=require('fs');const f='reports/gate-evidence-flutter.jsonl';if(!fs.existsSync(f)){console.log('no evidence file')}else{for(const l of fs.readFileSync(f,'utf8').split('\n'))if(l.trim()){const r=JSON.parse(l);if(r.status!=='PASS')console.log(r.status,r.test_id,'|',r.description,'| expected',JSON.stringify(r.expected),'| actual',JSON.stringify(r.actual))}}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-evidence-flutter
          path: quran_api/reports/gate-evidence-flutter.jsonl
          retention-days: 14

  gate-android:
    name: Gate · android (release APK + on-device run)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: postgresql://postgres:falah@127.0.0.1:5432/postgres
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quran_api/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: npm ci
        working-directory: quran_api

      - name: PostgreSQL for the dataset (plain container, not a service)
        run: |
          docker run -d --name gate-db -e POSTGRES_PASSWORD=falah -p 5432:5432 postgres:16-alpine
          for attempt in $(seq 1 60); do
            if docker exec gate-db pg_isready -U postgres > /dev/null 2>&1; then
              echo "postgres is ready"; exit 0
            fi
            sleep 1
          done
          echo "postgres never became ready"; docker logs gate-db; exit 1

      - name: Build the dataset the device will read
        run: |
          npm run db:apply
          npm run import -- --version=${{ env.QURAN_DATASET_VERSION }} --translations=en --publish
          node scripts/device-expectations.ts --dataset-version=${{ env.QURAN_DATASET_VERSION }} --edition=quran-json-uthmani-hafs
        working-directory: quran_api

      # The emulator talks to the API in the real private posture — private mode
      # on, no public data, no licence claimed — and authenticates like the app
      # will inside FALAH, with an internal token.
      - name: Serve the API for the emulator (private posture, internal token)
        working-directory: quran_api
        env:
          HOST: 0.0.0.0
          PORT: '8787'
          PRIVATE_MODE: 'true'
          PUBLIC_DATA_ENABLED: 'false'
          CONTENT_LICENSE_CONFIRMED: 'false'
          RATE_LIMIT_MAX: '1000000'
          SUPABASE_JWT_SECRET: gate-secret-for-falah-quran-api-quality-gate
        run: |
          node --input-type=module -e "
            import { signSupabaseJwt } from './src/auth/jwt.ts';
            process.stdout.write(signSupabaseJwt({ sub: '00000000-0000-0000-0000-000000000001', role: 'authenticated' }, process.env.SUPABASE_JWT_SECRET));
          " > /tmp/gate-token
          echo "GATE_API_TOKEN=$(cat /tmp/gate-token)" >> "$GITHUB_ENV"
          nohup node src/server.ts > /tmp/api-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8787/api/v1/health > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 1
          done
          echo "API did not come up"; cat /tmp/api-server.log; exit 1

      # The APK build and its inspection are architecture-independent, so they
      # run once (on the newest API level) — running them per matrix entry would
      # record the same test ids twice.
      - name: Android project checks + release APK
        if: matrix.api-level == 34
        working-directory: quran_api
        run: node tests/gate/run.ts mobile --label=android-apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: On-device gate run (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          working-directory: flutter_app
          script: |
            flutter pub get
            flutter gen-l10n
            flutter devices
            flutter test integration_test/gate_device_test.dart -d emulator-5554 --dart-define=GATE_API_BASE_URL=http://10.0.2.2:8787 --dart-define=GATE_API_TOKEN=${{ env.GATE_API_TOKEN }} --dart-define=GATE_DEVICE_PROFILE=android-api-${{ matrix.api-level }} --dart-define=GATE_BUILD=ci --dart-define=GATE_DATASET_VERSION=${{ env.QURAN_DATASET_VERSION }} > /tmp/device-run-${{ matrix.api-level }}.log 2>&1
            status=$?
            cat /tmp/device-run-${{ matrix.api-level }}.log
            exit $status

      - name: Device log (always, so a failure is readable)
        if: always()
        run: |
          echo "--- device run log"
          cat /tmp/device-run-${{ matrix.api-level }}.log 2>/dev/null | tail -n 120 || echo "no device log was produced"
          echo "--- api server log"
          tail -n 40 /tmp/api-server.log 2>/dev/null || echo "no api log"

      - name: Turn the device output into gate evidence
        if: always()
        run: |
          mkdir -p quran_api/reports
          if [ ! -f /tmp/device-run-${{ matrix.api-level }}.log ]; then
            echo "the device run never started — an earlier step failed; nothing to convert"
            exit 0
          fi
          grep -h '^GATE_RECORD ' /tmp/device-run-${{ matrix.api-level }}.log \
            | sed 's/^GATE_RECORD //' \
            > quran_api/reports/gate-evidence-android-${{ matrix.api-level }}.jsonl
          count=$(wc -l < quran_api/reports/gate-evidence-android-${{ matrix.api-level }}.jsonl)
          echo "device cases recorded: $count"
          test "$count" -gt 0

      - name: Why it failed (every non-PASS case)
        if: failure()
        working-directory: quran_api
        run: |
          for f in reports/gate-evidence-android-apk.jsonl reports/gate-evidence-android-${{ matrix.api-level }}.jsonl; do
            test -f "$f" || continue
            echo "--- $f"
            node -e "const fs=require('fs');for(const l of fs.readFileSync(process.argv[1],'utf8').split('\n'))if(l.trim()){const r=JSON.parse(l);if(r.status!=='PASS')console.log(r.status,r.test_id,'|',r.description,'| expected',JSON.stringify(r.expected),'| actual',JSON.stringify(r.actual))}" "$f"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-evidence-android-${{ matrix.api-level }}
          path: |
            quran_api/reports/gate-evidence-android-apk.jsonl
            quran_api/reports/gate-evidence-android-${{ matrix.api-level }}.jsonl
          if-no-files-found: error
          retention-days: 14

  gate-merge:
    name: Gate · merge (release result)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gate-core, gate-web, gate-docker, gate-flutter, gate-android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quran_api/package-lock.json
      - run: npm ci
        working-directory: quran_api
      - uses: actions/download-artifact@v4
        with:
          path: quran_api/reports/evidence
          pattern: gate-evidence-*
          merge-multiple: false
      - name: Merge every evidence file into the release result
        run: node tests/gate/merge.ts reports/evidence --release
        working-directory: quran_api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-gate-release
          path: |
            quran_api/reports/TEST_MASTER_REPORT.txt
            quran_api/reports/TEST_QUALITY_AUDIT.txt
            quran_api/reports/gate-evidence.jsonl.gz
            quran_api/reports/gate-evidence-sample.jsonl
            quran_api/reports/gate-evidence-sources.json
          retention-days: 30
