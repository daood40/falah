# Hadith API backend: typecheck, migrations, tests, integrity, live API smoke.
name: Backend CI

on:
  push:
    paths: ['backend/**', 'supabase/migrations/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'supabase/migrations/**', '.github/workflows/backend.yml']
  workflow_dispatch:

jobs:
  backend:
    name: Typecheck · Migrate · Test · Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: falah
          POSTGRES_DB: falah_corpus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: falah
      PGDATABASE: falah_corpus_test
      DATABASE_URL: postgresql://postgres:falah@127.0.0.1:5432/falah_corpus_test
      ADMIN_API_KEY: ci-admin-key
      SUPABASE_JWT_SECRET: ci-jwt-secret
      ENVIRONMENT: test
      CONTENT_LICENSE_CONFIRMED: 'false'
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Apply migrations
        working-directory: .
        run: |
          for f in supabase/migrations/*.sql; do
            echo "applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run --reporter=verbose

      - name: Data integrity report
        run: npm run verify

      - name: Live API contract check
        run: |
          node --experimental-strip-types src/http/server.ts &
          API_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8787/api/v1/health >/dev/null && break || sleep 1
          done
          set -e
          curl -sf http://127.0.0.1:8787/api/v1/health | tee /dev/stderr | grep -q '"database":"up"'
          curl -sf http://127.0.0.1:8787/api/v1/books  | grep -q '"success":true'
          curl -sf http://127.0.0.1:8787/api/v1/hadiths | grep -q '"success":true'
          curl -sf http://127.0.0.1:8787/api/v1/stats  | grep -q '"hadiths"'
          curl -s  "http://127.0.0.1:8787/api/v1/search?q=%D8%A7%D9%84%D8%AD" | grep -q '"success"'
          curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8787/api/v1/admin/stats | grep -q 401
          npm run smoke
          kill $API_PID
