openapi: 3.1.0
info:
  title: FALAH Hadith API
  version: 1.0.0
  description: |
    REST API over the FALAH hadith corpus (PostgreSQL / Supabase).

    Rules that shape this contract:
      * Religious text is never generated, edited, corrected or rephrased.
      * Any field absent from the source is `null` — never guessed.
      * Imported text is `source_locked`; corrections arrive as a new
        `dataset_version`, never as an update of a historical row.
      * While `CONTENT_LICENSE_CONFIRMED=false`, the public API returns
        `raw_text`, `matn`, `isnad` and `takhrij` as `null` and sets
        `text_available: false`. Admin credentials still read them internally.
  license:
    name: Application code — project license; corpus content — see the edition's source.
servers:
  - url: http://127.0.0.1:8787
    description: Local development
  - url: https://api.staging.falah.app
    description: Staging (CONTENT_LICENSE_CONFIRMED=false)
  - url: https://api.falah.app
    description: Production

tags:
  - name: system
  - name: hadiths
  - name: catalogue
  - name: classification
  - name: verification
  - name: search
  - name: admin

security: []

components:
  securitySchemes:
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase JWT with `app_metadata.corpus_role = "admin"`, or the
        server-to-server `ADMIN_API_KEY`. The Supabase service-role key is
        never used by a client and never leaves the server.
  parameters:
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Hard-capped by MAX_PAGE_LIMIT; a larger value is rejected with 422.
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    include:
      name: include
      in: query
      description: >-
        Comma-separated extra blocks (§14): narrators, references, takhrij,
        gradings, verification. Nothing heavy is sent unless asked for.
      schema: { type: string, example: 'narrators,gradings' }
  schemas:
    Meta:
      type: object
      properties:
        page: { type: integer }
        current_page: { type: integer, description: Same value as page, under the name the Falah client reads. }
        limit: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [BAD_REQUEST, VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND,
                     METHOD_NOT_ALLOWED, RATE_LIMITED, CONTENT_LICENSE_RESTRICTED,
                     SOURCE_LOCKED, INTERNAL_ERROR]
            message: { type: string }
            details: {}
        meta:
          type: object
          properties:
            request_id: { type: string }
    Ref:
      type: object
      nullable: true
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    HadithListItem:
      type: object
      description: The slim shape lists and search results return (§3).
      properties:
        id: { type: string, format: uuid }
        number: { type: [string, 'null'], description: As the source prints it; null when it prints none. }
        text: { type: [string, 'null'], description: Null while the content licence is unconfirmed. }
        text_available: { type: boolean }
        book_id: { type: [string, 'null'], format: uuid }
        chapter_id: { type: [string, 'null'], format: uuid }
        source_id: { type: [string, 'null'], format: uuid }
        volume: { type: [integer, 'null'] }
        page: { type: [integer, 'null'] }
        dataset_version: { type: string }
        content_hash: { type: string, description: SHA-256 of the text, computed by the database. }
        verification_status: { type: string, enum: [pending, verified, needs_review, rejected] }
    Hadith:
      type: object
      description: The standard detail response (§13). Optional blocks arrive via ?include=.
      properties:
        id: { type: string, format: uuid }
        number: { type: [string, 'null'] }
        text: { type: [string, 'null'] }
        text_available: { type: boolean }
        source:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        book:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        chapter:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
        location:
          type: object
          properties:
            volume: { type: [integer, 'null'] }
            page: { type: [integer, 'null'] }
            locator: { type: [string, 'null'], description: Position in the print; never a hadith number. }
        dataset:
          type: object
          properties:
            version: { type: string }
            hash: { type: string, description: This record's SHA-256. }
            dataset_hash: { type: [string, 'null'], description: Fingerprint of the whole dataset. }
        verification:
          type: object
          properties:
            verified: { type: boolean }
            status: { type: string }
        source_locked: { type: boolean }
        narrators: { type: array, items: { $ref: '#/components/schemas/Narrator' }, description: Only with ?include=narrators }
        references: { type: array, items: { $ref: '#/components/schemas/Reference' }, description: Only with ?include=references }
        takhrij: { $ref: '#/components/schemas/Takhrij' }
        gradings: { type: array, items: { $ref: '#/components/schemas/Grading' }, description: Only with ?include=gradings }
    Reference:
      type: object
      properties:
        source: { type: [string, 'null'] }
        book: { type: [string, 'null'] }
        edition: { type: [string, 'null'] }
        volume: { type: [integer, 'null'] }
        page: { type: [integer, 'null'] }
        locator: { type: [string, 'null'] }
        reference_number: { type: [string, 'null'] }
        reference_text: { type: [string, 'null'] }
    Takhrij:
      type: object
      properties:
        hadith_id: { type: string, format: uuid }
        takhrij_text: { type: [string, 'null'] }
        text_available: { type: boolean }
        sources: { type: array, items: { type: string } }
        references: { type: array, items: { $ref: '#/components/schemas/Reference' } }
        dataset_version: { type: string }
    Grading:
      type: object
      description: A hadith may carry several gradings; none is mandatory (§10).
      properties:
        grading_text: { type: string }
        source: { type: [string, 'null'] }
        reference: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        dataset_version: { type: string }
    Verification:
      type: object
      description: The three layers, kept apart (§11).
      properties:
        source_match: { type: boolean, description: The stored text still matches the file it came from. }
        cross_check: { type: string, enum: [SUPPORTED, PARTIAL, NOT_FOUND, UNKNOWN] }
        cross_check_detail:
          type: object
          properties:
            similarity: { type: [number, 'null'] }
            collection: { type: [string, 'null'] }
        human_review: { type: boolean, description: A human compared this record against the printed edition. }
        verified: { type: boolean, description: Never true without a recorded human check. }
        status: { type: string }
        content_hash: { type: string }
        dataset_version: { type: string }
    DatasetVersion:
      type: object
      properties:
        version: { type: string }
        dataset_hash: { type: [string, 'null'] }
        record_count: { type: [integer, 'null'] }
        status: { type: string, enum: [draft, sealed, superseded] }
        is_active: { type: boolean }
        source_name: { type: [string, 'null'] }
    HadithList:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items: { $ref: '#/components/schemas/HadithListItem' }
        meta: { $ref: '#/components/schemas/Meta' }
    Book:
      type: object
      properties:
        id: { type: string, format: uuid }
        edition_id: { type: string, format: uuid }
        external_key: { type: [string, 'null'] }
        name: { type: string }
        order_number: { type: [integer, 'null'] }
        description: { type: [string, 'null'] }
        hadith_count: { type: integer }
    Chapter:
      type: object
      properties:
        id: { type: string, format: uuid }
        book_id: { type: string, format: uuid }
        parent_id: { type: [string, 'null'], format: uuid }
        title: { type: string }
        name: { type: string, description: Same value as title, kept for existing consumers. }
        number: { type: [string, 'null'] }
        order_number: { type: [integer, 'null'] }
        page_start: { type: [integer, 'null'] }
        page_end: { type: [integer, 'null'] }
        hadith_count: { type: integer }
    Narrator:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kunya: { type: [string, 'null'] }
        laqab: { type: [string, 'null'] }
        biography: { type: [string, 'null'], description: Only if the source carries it. }
        source_reference: { type: [string, 'null'] }
        hadith_count: { type: integer }
    Source:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        url: { type: [string, 'null'] }
        publisher: { type: [string, 'null'] }
        license_status:
          type: string
          enum: [unconfirmed, pending_review, confirmed, restricted, blocked]
    Edition:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        author: { type: [string, 'null'] }
        publisher: { type: [string, 'null'] }
        edition_number: { type: [integer, 'null'] }
        publication_year: { type: [integer, 'null'] }
        hijri_year: { type: [integer, 'null'] }
        volume_count: { type: [integer, 'null'] }
        isbn: { type: [string, 'null'] }
        page_count: { type: [integer, 'null'] }
        source_url: { type: [string, 'null'] }
        dataset_version: { type: [string, 'null'] }
    Stats:
      type: object
      properties:
        sources: { type: integer }
        editions: { type: integer }
        books: { type: integer }
        chapters: { type: integer }
        hadiths: { type: integer }
        narrators: { type: integer }
        verified_hadiths: { type: integer }
        pending_hadiths: { type: integer }
        dataset_version: { type: string }
        content_license_confirmed: { type: boolean }
  responses:
    BadRequest:
      description: Malformed request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing or invalid credentials
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Validation:
      description: Invalid parameters
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Too many requests
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

paths:
  /api/v1/health:
    get:
      tags: [system]
      summary: Liveness of API, database, dataset and licence flag (no secrets)
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      api: { type: string }
                      database: { type: string, enum: [up, down] }
                      environment: { type: string }
                      dataset_version: { type: [string, 'null'] }
                      content_license_confirmed: { type: boolean }
        '503': { description: Database unreachable }

  /api/v1/stats:
    get:
      tags: [system]
      summary: Real counts from the database
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Stats' }

  /api/v1/hadiths:
    get:
      tags: [hadiths]
      summary: List hadiths
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - { name: edition_id, in: query, schema: { type: string, format: uuid } }
        - { name: source_id, in: query, schema: { type: string, format: uuid } }
        - { name: book_id, in: query, schema: { type: string, format: uuid } }
        - { name: chapter_id, in: query, schema: { type: string, format: uuid } }
        - { name: narrator_id, in: query, schema: { type: string, format: uuid } }
        - { name: volume, in: query, schema: { type: integer } }
        - { name: page_number, in: query, schema: { type: integer } }
        - { name: verification_status, in: query, schema: { type: string, enum: [pending, verified, needs_review, rejected] } }
        - { name: dataset_version, in: query, schema: { type: string } }
        - { name: grading, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: A page of hadiths
          content: { application/json: { schema: { $ref: '#/components/schemas/HadithList' } } }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/hadiths/random:
    get:
      tags: [hadiths]
      summary: One existing record at random (§18 — nothing is generated)
      parameters:
        - { name: book_id, in: query, schema: { type: string, format: uuid } }
        - { name: chapter_id, in: query, schema: { type: string, format: uuid } }
        - { name: source_id, in: query, schema: { type: string, format: uuid } }
        - { name: grading, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/include'
      responses:
        '200':
          description: A record that exists in the dataset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Hadith' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/hadiths/daily:
    get:
      tags: [hadiths]
      summary: The record of the day — deterministic (§19)
      description: >-
        The same date and the same dataset always return the same record. The
        seed is the date plus the dataset fingerprint, so a new dataset rotates
        the choice instead of silently keeping a stale one. No AI, no generation.
      parameters:
        - { name: date, in: query, schema: { type: string, format: date }, description: Defaults to today (UTC). }
        - $ref: '#/components/parameters/include'
      responses:
        '200':
          description: The record for that day
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Hadith' }
                  meta:
                    type: object
                    properties:
                      date: { type: string, format: date }
                      dataset_version: { type: string }
                      deterministic: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/hadiths/{id}:
    get:
      tags: [hadiths]
      summary: One hadith (the standard detail response)
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/include'
      responses:
        '200':
          description: The hadith
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Hadith' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /api/v1/hadiths/by-number/{number}:
    get:
      tags: [hadiths]
      summary: Lookup by the source's hadith number (may match several editions)
      parameters:
        - { name: number, in: path, required: true, schema: { type: string } }
        - { name: edition_id, in: query, schema: { type: string, format: uuid } }
        - { name: dataset_version, in: query, schema: { type: string } }
      responses:
        '200':
          description: Matching hadiths
          content: { application/json: { schema: { $ref: '#/components/schemas/HadithList' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/hadiths/{id}/narrators:
    get:
      tags: [hadiths]
      summary: The narrators this record names (§7)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: Narrators, verbatim from the source
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Narrator' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/hadiths/{id}/references:
    get:
      tags: [hadiths]
      summary: Where this record sits and what it points at (§8)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: References
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Reference' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/hadiths/{id}/takhrij:
    get:
      tags: [hadiths]
      summary: The takhrij line, unchanged (§9)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: The takhrij
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Takhrij' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/hadiths/{id}/gradings:
    get:
      tags: [hadiths]
      summary: Every grading recorded for this record (§10)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: Gradings — possibly none, possibly several
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Grading' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/hadiths/{id}/verification:
    get:
      tags: [verification]
      summary: Source match, cross-check and human review, kept apart (§11)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: The verification state
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Verification' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sources/{id}:
    get:
      tags: [catalogue]
      summary: One source with its licence status
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: The source
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Source' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/books/{id}/chapters:
    get:
      tags: [catalogue]
      summary: The chapters of one book (§6)
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: A page of chapters
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Chapter' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/version:
    get:
      tags: [system]
      summary: API version and dataset fingerprint (§12)
      responses:
        '200':
          description: What a client is holding
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      api_version: { type: string }
                      dataset_version: { type: [string, 'null'] }
                      dataset_hash: { type: [string, 'null'] }
                      record_count: { type: [integer, 'null'] }
                      status: { type: [string, 'null'] }
                      content_license_confirmed: { type: boolean }

  /api/v1/datasets:
    get:
      tags: [system]
      summary: Every dataset version known to this service
      responses:
        '200':
          description: Dataset versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/DatasetVersion' } }

  /api/v1/books:
    get:
      tags: [catalogue]
      summary: List books (كتب/أقسام) of an edition
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - { name: edition_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: A page of books
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Book' } }
                  meta: { $ref: '#/components/schemas/Meta' }

  /api/v1/books/{id}:
    get:
      tags: [catalogue]
      summary: One book
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: The book
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Book' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/books/{id}/hadiths:
    get:
      tags: [catalogue]
      summary: Hadiths of a book
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: A page of hadiths
          content: { application/json: { schema: { $ref: '#/components/schemas/HadithList' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/chapters:
    get:
      tags: [catalogue]
      summary: List chapters (أبواب), optionally by book or parent
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - { name: book_id, in: query, schema: { type: string, format: uuid } }
        - { name: parent_id, in: query, schema: { type: string, format: uuid } }
        - { name: root, in: query, schema: { type: string, enum: ['true'] } }
      responses:
        '200':
          description: A page of chapters
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Chapter' } }
                  meta: { $ref: '#/components/schemas/Meta' }

  /api/v1/chapters/{id}:
    get:
      tags: [catalogue]
      summary: One chapter
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: The chapter
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Chapter' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/chapters/{id}/hadiths:
    get:
      tags: [catalogue]
      summary: Hadiths of a chapter
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: A page of hadiths
